name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:e2e
      - run: bun run test
      - run: bun run build
      - name: Package contents
        run: npm pack --dry-run

  e2e:
    # The scenarios drive a sandboxed OpenCode with its own config, data, and database.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: npm install --global @opencode/cli@2.2.0
      - run: bun run build
      - name: Smoke test
        run: bun run probe ./test/e2e/smoke.ts
      - name: Scenarios
        run: |
          status=0
          for scenario in test/e2e/scenarios/*.ts; do
            echo "::group::$scenario"
            bun run probe "./$scenario" || status=1
            echo "::endgroup::"
          done
          exit $status
