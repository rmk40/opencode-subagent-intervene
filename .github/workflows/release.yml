name: Release

# Publishes to npm through trusted publishing (OIDC), which adds signed provenance, then creates
# the GitHub Release. The npm trusted publisher names this file, so keep its name.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Runs the project's code and its dependencies, so it gets no publishing rights.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Holds the publishing rights and runs no project code: it packs the verified build and the
  # checked-out files, with lifecycle scripts skipped.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 bundles.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping the publish."
            exit 0
          fi
          case "$version" in
            *-*) npm publish --access public --ignore-scripts --tag next ;;
            *) npm publish --access public --ignore-scripts ;;
          esac
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          case "$TAG" in
            *-*) gh release create "$TAG" --generate-notes --verify-tag --prerelease --latest=false ;;
            *) gh release create "$TAG" --generate-notes --verify-tag --latest=true ;;
          esac
